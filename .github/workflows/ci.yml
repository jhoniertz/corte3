name: validar HTML
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validar:
    name: Crear maquina virtual
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el codigo
        uses: actions/checkout@v4

      - name: Instalar node
        uses: actions/setup-node@v4
        with:
          node-version: 22
        
      - name: validar codigo HTML
        run: |
         echo "inicio"
         npx html-validate "**/*.html"
         echo "fin"